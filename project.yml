name: NebraskaEats
options:
  bundleIdPrefix: com.nebraskaeats
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: "4C8TU6U7MQ"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  NebraskaEats:
    type: application
    platform: iOS
    sources:
      - path: NebraskaEats
    info:
      path: NebraskaEats/Info.plist
      properties:
        CFBundleDisplayName: Nebraska Eats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Light      # the palette is light-only (Design/Theme.swift); dark mode made lists unreadable
        NSLocationWhenInUseUsageDescription: "Your location sorts steakhouses, taquerías and restaurants by distance and shows where you are on the map. It stays on your device."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [maps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nebraskaeats.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [NebraskaEatsTests, NebraskaEatsUITests]

  NebraskaEatsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NebraskaEatsTests
    dependencies:
      - target: NebraskaEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nebraskaeats.ios.tests
        GENERATE_INFOPLIST_FILE: true

  NebraskaEatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NebraskaEatsUITests
    dependencies:
      - target: NebraskaEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nebraskaeats.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: NebraskaEats
